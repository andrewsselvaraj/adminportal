<div class="stream-container">
  <h2>Server Time Stream andre</h2>
  <p style="color: #666; font-size: 0.9rem;">Real-time server time updates via Server-Sent Events</p>
  
  <div style="margin-top: 1rem; margin-bottom: 1rem;">
    <button (click)="startStream()" [disabled]="loading" style="padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; background-color: #00aa00; color: white; border: none; border-radius: 4px; margin-right: 0.5rem;">
      {{ loading ? 'Streaming...Tes' : 'Start Stream' }} {{streamData.length}}
    </button>
    <button (click)="stopStream()" [disabled]="!loading" style="padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; background-color: #aa0000; color: white; border: none; border-radius: 4px;">
      Stop Stream
    </button>
  </div>
  
  <div *ngIf="error && !loading" class="error" style="margin-top: 1rem; color: #cc0000; padding: 0.5rem; background-color: #ffe0e0; border-radius: 4px;">
    {{ error }}
  </div>
  
  <div *ngIf="streamData.length > 0" class="result" style="margin-top: 1rem; padding: 1rem; background-color: #e8f4f8; border-left: 4px solid #0066cc; border-radius: 4px;">
    <p><strong>Stream Data (Latest 50 messages):</strong></p>
    <div style="max-height: 300px; overflow-y: auto; background-color: #ffffff; padding: 0.5rem; border-radius: 4px; font-family: monospace;">
      <div *ngFor="let data of streamData" style="padding: 0.25rem; border-bottom: 1px solid #ddd; color: #333;">
        {{ data }}
      </div>
    </div>
  </div>
  
  <div *ngIf="loading && streamData.length === 0" class="loading" style="margin-top: 1rem; color: #666; font-style: italic;">
    Connecting to stream...{{streamData.length}}
  </div>
</div>

<div *ngFor="let data of streamData" style="padding: 0.25rem; border-bottom: 1px solid #ddd; color: #333;">
        {{ data }}
      </div>
