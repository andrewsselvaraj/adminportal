<div class="temperature-container">
  <h2>Temperature Data</h2>
  
  <button (click)="fetchTemperature()" [disabled]="loading" style="padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; background-color: #0066cc; color: white; border: none; border-radius: 4px;">
    {{ loading ? 'Fetching...' : 'Get Temperature' }}
  </button>
  
  <div *ngIf="loading" class="loading" style="margin-top: 1rem; color: #666;">
    Loading...
  </div>
  
  <div *ngIf="error && !loading" class="error" style="margin-top: 1rem; color: #cc0000;">
    {{ error }}
  </div>
  
  <div *ngIf="temperature && !loading" class="result" style="margin-top: 1rem; padding: 1rem; background-color: #e8f4f8; border-left: 4px solid #0066cc; border-radius: 4px;">
    <p><strong>Temperature Value:</strong> {{ temperature }}</p>
  </div>
</div>
